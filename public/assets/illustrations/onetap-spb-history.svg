<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">OneTap-SPB history tab with search, date filters, a list of delivery notes and the selected note's details, and a dialog comparing a duplicate card with the saved data. Demo data.</title>
  <defs>
