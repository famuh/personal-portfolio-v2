<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration: a maintenance app scanning a machine QR code, an issue form with parameter readings marked normal, warning and critical, and a list of work orders</title>
  <defs>
