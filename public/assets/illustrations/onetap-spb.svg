<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">OneTap-SPB: an NFC delivery card tapped on a USB reader at the weighbridge, a palm fruit truck, and the desktop app showing the card's delivery note saved to the database. Demo data.</title>
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1f33"/><stop offset="1" stop-color="#08131f"/></linearGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#3b82f6" stop-opacity=".24"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#3ddc84" stop-opacity=".16"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <filter id="sh" x="-20%" y="-10%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f80ed"/><stop offset="1" stop-color="#1747a6"/></linearGradient>
    <linearGradient id="reader" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d34"/><stop offset="1" stop-color="#121418"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d58a"/><stop offset="1" stop-color="#c49a3c"/></linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#c2700a"/></linearGradient>
    <radialGradient id="fruitR"><stop offset="0" stop-color="#e2572b"/><stop offset="1" stop-color="#7a1d12"/></radialGradient>
    <radialGradient id="fruitD"><stop offset="0" stop-color="#5a2a22"/><stop offset="1" stop-color="#221010"/></radialGradient>
    <radialGradient id="fruitO"><stop offset="0" stop-color="#f3a531"/><stop offset="1" stop-color="#b4521a"/></radialGradient>
    <clipPath id="win"><rect width="920" height="680" rx="18"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bgG)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1150" cy="140" rx="820" ry="420" fill="url(#glowB)"/>
  <ellipse cx="300" cy="520" rx="420" ry="300" fill="url(#glowG)"/>

  <!-- USB cable from the reader to the PC -->
  <path d="M470 560 C 560 560, 560 700, 660 720" fill="none" stroke="#2a2d34" stroke-width="9" stroke-linecap="round"/>

  <!-- App window: Baca Kartu tab -->
  <g transform="translate(620 80)">
    <g filter="url(#sh)"><rect width="920" height="680" rx="18" fill="#f3f4f6"/></g>
    <g clip-path="url(#win)" font-family="Inter, 'Segoe UI', Arial, sans-serif">
      <rect width="920" height="680" fill="#f3f4f6"/>
      <rect width="920" height="36" fill="#ffffff"/>
      <rect x="14" y="10" width="16" height="16" rx="3" fill="#2563eb"/>
      <text x="22" y="22.5" font-size="11" fill="#fff" font-weight="700" text-anchor="middle">F</text>
      <text x="40" y="23" font-size="12" fill="#333">OneTap-SPB - One Tap SPB with NFC Card</text>
      <path d="M816 18h12" stroke="#333" stroke-width="1.3"/>
      <rect x="849" y="12" width="11" height="11" fill="none" stroke="#333" stroke-width="1.3"/>
      <path d="M884 12l11 11M895 12l-11 11" stroke="#333" stroke-width="1.3"/>
      <rect y="36" width="920" height="90" fill="#ffffff"/>
      <rect y="125" width="920" height="1" fill="#e5e7eb"/>
      <rect x="24" y="52" width="56" height="56" rx="12" fill="#2563eb"/>
      <text x="52" y="90" font-size="26" fill="#fff" font-weight="700" text-anchor="middle">F</text>
      <text x="96" y="78" font-size="22" fill="#111" font-weight="700">OneTap-SPB</text>
      <text x="96" y="100" font-size="12.5" fill="#555">One Tap SPB with NFC Card</text>
      <circle cx="578" cy="70" r="4.5" fill="#16a34a"/>
      <text x="590" y="74" font-size="12" fill="#444">Reader: ACS ACR122U</text>
      <circle cx="578" cy="96" r="4.5" fill="#16a34a"/>
      <text x="590" y="100" font-size="12" fill="#444">Database: SQL Server</text>
      <text x="896" y="64" font-size="13" fill="#111" font-weight="700" text-anchor="end">Operator</text>
      <text x="896" y="82" font-size="11" fill="#2563eb" text-anchor="end">NIK 1024</text>
      <rect x="806" y="92" width="90" height="26" rx="6" fill="#e5e7eb"/>
      <text x="851" y="109" font-size="12" fill="#222" text-anchor="middle">Keluar</text>

      <rect x="20" y="140" width="162" height="30" rx="6" fill="#e5e7eb"/>
      <rect x="23" y="143" width="84" height="24" rx="4" fill="#ffffff"/>
      <text x="65" y="160" font-size="12" fill="#111" font-weight="700" text-anchor="middle">Baca Kartu</text>
      <text x="144" y="160" font-size="12" fill="#333" font-weight="600" text-anchor="middle">Riwayat</text>

      <rect x="20" y="184" width="880" height="50" rx="10" fill="#dcfce7" stroke="#bbf7d0"/>
      <circle cx="46" cy="209" r="11" fill="#16a34a"/>
      <path d="M41 209l3.5 3.5 6.5-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="214.5" font-size="15" fill="#15803d" font-weight="700">SPB SPB/KBN/211026/0001 tersimpan ke database.</text>

      <rect x="20" y="248" width="880" height="270" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="40" y="276" font-size="14" fill="#111" font-weight="700">Data SPB di kartu</text>
      <g font-size="12">
        <text x="40" y="304" fill="#6b7280">No. Polisi</text><text x="118" y="304" fill="#111" font-weight="700">BK 8812 XA</text>
        <text x="300" y="304" fill="#6b7280">No. SPB</text><text x="374" y="304" fill="#111" font-weight="700">SPB/KBN/211026/0001</text>
        <text x="600" y="304" fill="#6b7280">Jenis Kartu</text><text x="680" y="304" fill="#111" font-weight="700">MIFARE Classic 1K</text>
        <text x="40" y="328" fill="#6b7280">UID Kartu</text><text x="118" y="328" fill="#111" font-weight="700">04A1B2C3</text>
        <text x="300" y="328" fill="#6b7280">Waktu Baca</text><text x="374" y="328" fill="#111" font-weight="700">21-10-2026 08:14:06</text>
      </g>
      <rect x="40" y="344" width="840" height="156" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
      <rect x="41" y="345" width="838" height="28" fill="#eef0f3"/>
      <g font-size="12" fill="#111" font-weight="700">
        <text x="62" y="364">No</text><text x="92" y="364">Blok</text><text x="270" y="364">Tahun Tanam</text><text x="470" y="364">Divisi</text><text x="740" y="364" text-anchor="end">Hasil</text><text x="866" y="364" text-anchor="end">Brondolan</text>
      </g>
      <rect x="41" y="403" width="838" height="30" fill="#f8f9fb"/>
      <rect x="41" y="463" width="838" height="30" fill="#f1f3f6"/>
      <g font-size="12" fill="#222">
        <text x="74" y="392" text-anchor="end">1</text><text x="92" y="392">A12</text><text x="270" y="392">2011</text><text x="470" y="392">DV01</text><text x="740" y="392" text-anchor="end">3.2</text><text x="866" y="392" text-anchor="end">0.2</text>
        <text x="74" y="422" text-anchor="end">2</text><text x="92" y="422">B07</text><text x="270" y="422">2009</text><text x="470" y="422">DV01</text><text x="740" y="422" text-anchor="end">5.6</text><text x="866" y="422" text-anchor="end">0.4</text>
        <text x="74" y="452" text-anchor="end">3</text><text x="92" y="452">C21</text><text x="270" y="452">2013</text><text x="470" y="452">DV02</text><text x="740" y="452" text-anchor="end">2.4</text><text x="866" y="452" text-anchor="end">0.1</text>
      </g>
      <g font-size="12" fill="#111" font-weight="700">
        <text x="92" y="482">TOTAL</text><text x="740" y="482" text-anchor="end">11.2</text><text x="866" y="482" text-anchor="end">0.7</text>
      </g>

      <text x="20" y="546" font-size="13" fill="#111" font-weight="700">Aktivitas sesi ini</text>
      <rect x="20" y="558" width="880" height="110" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
      <g font-family="Consolas, 'Geist Mono', monospace" font-size="11.5">
        <text x="34" y="582" fill="#15803d">08:14:06  SPB SPB/KBN/211026/0001 tersimpan ke database. (BK 8812 XA, 3 baris)</text>
        <text x="34" y="602" fill="#b45309">08:11:42  Kartu terbaca, tetapi tidak berisi data SPB. (UID 04F1C2D9)</text>
        <text x="34" y="622" fill="#b45309">08:09:30  SPB SPB/KBN/201026/0007 sudah ada, data tidak diubah. (BK 1290 TF, 2 baris)</text>
        <text x="34" y="642" fill="#15803d">08:06:51  SPB SPB/KBN/211026/0002 tersimpan ke database. (BK 3307 RD, 4 baris)</text>
        <text x="34" y="662" fill="#15803d">08:02:17  SPB SPB/AFD/211026/0004 tersimpan ke database. (BK 9054 KL, 2 baris)</text>
      </g>
    </g>
  </g>

  <!-- Toast: card read -->
  <g filter="url(#sh)"><rect x="80" y="112" width="360" height="84" rx="18" fill="#fff"/></g>
  <rect x="96" y="130" width="48" height="48" rx="12" fill="#2563eb"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <path d="M113 146a14 14 0 0 1 0 16"/><path d="M119 141a21 21 0 0 1 0 26"/><path d="M125 136a28 28 0 0 1 0 36"/>
  </g>
  <text x="158" y="150" font-family="Inter, Arial, sans-serif" font-size="17" fill="#111" font-weight="700">Kartu terbaca</text>
  <text x="158" y="172" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#6b6b70">MIFARE Classic 1K · UID 04A1B2C3</text>

  <!-- NFC reader -->
  <g filter="url(#sh)"><rect x="140" y="430" width="340" height="190" rx="30" fill="url(#reader)"/></g>
  <rect x="152" y="440" width="316" height="6" rx="3" fill="#ffffff" fill-opacity=".08"/>
  <circle cx="440" cy="466" r="7" fill="#22c55e"/>
  <circle cx="440" cy="466" r="14" fill="#22c55e" fill-opacity=".25"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <path d="M296 520a16 16 0 0 1 0 22"/><path d="M304 512a28 28 0 0 1 0 38"/><path d="M312 504a40 40 0 0 1 0 54"/>
  </g>
  <text x="310" y="600" font-family="Inter, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".45" text-anchor="middle" letter-spacing="2">ACR122U</text>

  <!-- Waves between card and reader -->
  <g fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round">
    <path d="M250 410q60 -26 120 0" stroke-opacity=".9"/>
    <path d="M226 392q84 -36 168 0" stroke-opacity=".55"/>
    <path d="M202 374q108 -46 216 0" stroke-opacity=".3"/>
  </g>

  <!-- NFC SPB card -->
  <g transform="translate(196 222) rotate(-9)">
    <g filter="url(#sh)"><rect width="250" height="156" rx="16" fill="url(#card)"/></g>
    <rect x="22" y="26" width="38" height="30" rx="6" fill="url(#chip)"/>
    <path d="M22 41h38M41 26v30" stroke="#a37a26" stroke-width="1.2"/>
    <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
      <path d="M200 30a10 10 0 0 1 0 14"/><path d="M206 25a17 17 0 0 1 0 24"/><path d="M212 20a24 24 0 0 1 0 34"/>
    </g>
    <text x="22" y="98" font-family="Inter, Arial, sans-serif" font-size="22" fill="#fff" font-weight="800">Kartu SPB</text>
    <text x="22" y="122" font-family="Consolas, 'Geist Mono', monospace" font-size="13" fill="#fff" fill-opacity=".85">BK 8812 XA</text>
    <text x="228" y="138" font-family="Inter, Arial, sans-serif" font-size="11" fill="#fff" fill-opacity=".7" text-anchor="end">NFC</text>
  </g>

  <!-- Weighbridge and palm fruit truck -->
  <rect x="40" y="866" width="560" height="14" rx="4" fill="#3b4250"/>
  <rect x="40" y="866" width="560" height="4" rx="2" fill="#5b6577"/>
  <g>
    <rect x="96" y="756" width="324" height="78" rx="8" fill="#1f5a3a"/>
    <path d="M96 776h324M96 798h324" stroke="#164229" stroke-width="2"/>
    <g>
      <circle cx="122" cy="748" r="20" fill="url(#fruitR)"/><circle cx="160" cy="742" r="24" fill="url(#fruitD)"/><circle cx="200" cy="746" r="21" fill="url(#fruitO)"/>
      <circle cx="240" cy="740" r="25" fill="url(#fruitR)"/><circle cx="282" cy="746" r="21" fill="url(#fruitD)"/><circle cx="322" cy="742" r="23" fill="url(#fruitR)"/>
      <circle cx="362" cy="747" r="20" fill="url(#fruitO)"/><circle cx="398" cy="750" r="18" fill="url(#fruitD)"/>
      <circle cx="182" cy="726" r="17" fill="url(#fruitR)"/><circle cx="262" cy="722" r="18" fill="url(#fruitO)"/><circle cx="340" cy="726" r="16" fill="url(#fruitD)"/>
    </g>
    <path d="M430 790v-46a10 10 0 0 1 10 -10h66l38 48v52h-114z" fill="url(#cab)"/>
    <path d="M452 746h50l26 34h-76z" fill="#cfe6ff" fill-opacity=".85"/>
    <rect x="430" y="822" width="114" height="12" fill="#a65f08"/>
    <rect x="82" y="832" width="470" height="10" rx="3" fill="#2a2d34"/>
    <g fill="#16181c"><circle cx="150" cy="846" r="22"/><circle cx="208" cy="846" r="22"/><circle cx="490" cy="846" r="22"/></g>
    <g fill="#6b7280"><circle cx="150" cy="846" r="9"/><circle cx="208" cy="846" r="9"/><circle cx="490" cy="846" r="9"/></g>
  </g>
</svg>
