<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration: a field app with a harvest work record and on-device fruit ripeness detection, an NFC card, and a web dashboard with production charts and a map</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1e"/>
      <stop offset="1" stop-color="#0a1a12"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5f2"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a14"/>
      <stop offset="1" stop-color="#1d2a12"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g fill="none" stroke="#34d399" stroke-opacity=".08" stroke-width="2">
    <path d="M0 820 C 300 760 500 880 800 820 S 1300 760 1600 820"/>
    <path d="M0 880 C 300 820 500 940 800 880 S 1300 820 1600 880"/>
  </g>

  <!-- web dashboard (back) -->
  <g transform="translate(760 120)">
    <rect width="760" height="520" rx="22" fill="#050a07"/>
    <rect x="14" y="14" width="732" height="492" rx="12" fill="url(#scr)"/>
    <rect x="14" y="14" width="150" height="492" rx="12" fill="#eef5f1"/>
    <g fill="#0b6b43" fill-opacity=".35"><rect x="36" y="48" width="90" height="12" rx="6"/><rect x="36" y="88" width="100" height="10" rx="5"/><rect x="36" y="114" width="80" height="10" rx="5"/><rect x="36" y="140" width="96" height="10" rx="5"/><rect x="36" y="166" width="70" height="10" rx="5"/></g>
    <g>
      <rect x="190" y="44" width="160" height="80" rx="12" fill="#ffffff" stroke="#e8e8e4"/>
      <rect x="370" y="44" width="160" height="80" rx="12" fill="#ffffff" stroke="#e8e8e4"/>
      <rect x="550" y="44" width="170" height="80" rx="12" fill="#ffffff" stroke="#e8e8e4"/>
      <rect x="206" y="62" width="60" height="8" rx="4" fill="#5d5d58" fill-opacity=".4"/><rect x="206" y="82" width="100" height="18" rx="6" fill="#0b0b0c"/>
      <rect x="386" y="62" width="60" height="8" rx="4" fill="#5d5d58" fill-opacity=".4"/><rect x="386" y="82" width="80" height="18" rx="6" fill="#0b0b0c"/>
      <rect x="566" y="62" width="60" height="8" rx="4" fill="#5d5d58" fill-opacity=".4"/><rect x="566" y="82" width="110" height="18" rx="6" fill="#047857"/>
    </g>
    <!-- bar chart -->
    <rect x="190" y="144" width="340" height="230" rx="12" fill="#ffffff" stroke="#e8e8e4"/>
    <g fill="#34d399"><rect x="216" y="290" width="22" height="60" rx="4"/><rect x="256" y="250" width="22" height="100" rx="4"/><rect x="296" y="270" width="22" height="80" rx="4"/><rect x="336" y="220" width="22" height="130" rx="4"/><rect x="376" y="240" width="22" height="110" rx="4"/><rect x="416" y="200" width="22" height="150" rx="4"/><rect x="456" y="230" width="22" height="120" rx="4"/></g>
    <g fill="#cfcfc9"><rect x="227" y="300" width="22" height="50" rx="4" fill-opacity="0"/></g>
    <polyline points="227,280 267,262 307,268 347,236 387,244 427,214 467,226" fill="none" stroke="#0b0b0c" stroke-width="3" stroke-dasharray="6 6"/>
    <!-- map -->
    <rect x="550" y="144" width="170" height="230" rx="12" fill="#e9f5ee" stroke="#e8e8e4"/>
    <g fill="none" stroke="#047857" stroke-opacity=".3" stroke-width="2"><path d="M560 200 L640 180 L710 220"/><path d="M570 300 L630 260 L700 290 L710 350"/><path d="M600 160 L620 360"/></g>
    <g fill="#047857"><circle cx="612" cy="230" r="7"/><circle cx="668" cy="300" r="7"/><circle cx="590" cy="320" r="7"/></g>
    <circle cx="612" cy="230" r="16" fill="#34d399" fill-opacity=".25"/>
    <!-- report table -->
    <rect x="190" y="394" width="530" height="96" rx="12" fill="#ffffff" stroke="#e8e8e4"/>
    <g fill="#5d5d58" fill-opacity=".35"><rect x="210" y="414" width="160" height="10" rx="5"/><rect x="210" y="440" width="300" height="8" rx="4"/><rect x="210" y="462" width="260" height="8" rx="4"/></g>
    <!-- chat bubble (AI assistant) -->
    <rect x="560" y="410" width="146" height="40" rx="20" fill="#0b0b0c"/>
    <circle cx="582" cy="430" r="8" fill="#34d399"/><rect x="598" y="425" width="90" height="10" rx="5" fill="#ffffff" fill-opacity=".8"/>
  </g>

  <!-- phone 1: BKM form -->
  <g transform="translate(150 140) rotate(-4)">
    <rect width="340" height="680" rx="44" fill="#050a07"/>
    <rect x="16" y="16" width="308" height="648" rx="30" fill="url(#scr)"/>
    <rect x="130" y="30" width="80" height="18" rx="9" fill="#050a07"/>
    <rect x="40" y="76" width="120" height="14" rx="7" fill="#0b0b0c"/>
    <rect x="40" y="100" width="170" height="10" rx="5" fill="#5d5d58" fill-opacity=".4"/>
    <rect x="236" y="74" width="64" height="28" rx="14" fill="#d1fae5"/><rect x="248" y="84" width="40" height="8" rx="4" fill="#047857"/>
    <g>
      <rect x="36" y="134" width="268" height="94" rx="16" fill="#ffffff" stroke="#e8e8e4"/>
      <rect x="36" y="240" width="268" height="94" rx="16" fill="#ffffff" stroke="#e8e8e4"/>
      <rect x="36" y="346" width="268" height="94" rx="16" fill="#ffffff" stroke="#e8e8e4"/>
      <g fill="#cfe9dc"><rect x="52" y="150" width="62" height="62" rx="12"/><rect x="52" y="256" width="62" height="62" rx="12"/><rect x="52" y="362" width="62" height="62" rx="12"/></g>
      <g fill="#0b0b0c"><rect x="128" y="160" width="110" height="12" rx="6"/><rect x="128" y="266" width="90" height="12" rx="6"/><rect x="128" y="372" width="120" height="12" rx="6"/></g>
      <g fill="#5d5d58" fill-opacity=".4"><rect x="128" y="184" width="150" height="8" rx="4"/><rect x="128" y="290" width="130" height="8" rx="4"/><rect x="128" y="396" width="140" height="8" rx="4"/></g>
      <g fill="#047857"><rect x="128" y="200" width="46" height="8" rx="4"/><rect x="128" y="306" width="46" height="8" rx="4"/><rect x="128" y="412" width="46" height="8" rx="4"/></g>
    </g>
    <rect x="36" y="462" width="268" height="110" rx="16" fill="#eef5f1"/>
    <g fill="#047857" fill-opacity=".5"><rect x="56" y="482" width="100" height="10" rx="5"/><rect x="56" y="504" width="200" height="8" rx="4"/><rect x="56" y="522" width="170" height="8" rx="4"/></g>
    <circle cx="270" cy="540" r="16" fill="none" stroke="#047857" stroke-width="3"/><circle cx="270" cy="540" r="4" fill="#047857"/>
    <rect x="36" y="592" width="268" height="52" rx="26" fill="#0b0b0c"/>
    <rect x="120" y="612" width="100" height="12" rx="6" fill="#34d399"/>
  </g>

  <!-- phone 2: ripeness detection -->
  <g transform="translate(470 300) rotate(5)">
    <rect width="300" height="600" rx="40" fill="#050a07"/>
    <rect x="14" y="14" width="272" height="572" rx="28" fill="url(#cam)"/>
    <g fill="#7a3b12"><circle cx="110" cy="210" r="46"/><circle cx="196" cy="300" r="52"/><circle cx="120" cy="390" r="44"/></g>
    <g fill="#c2410c" fill-opacity=".7"><circle cx="100" cy="200" r="20"/><circle cx="186" cy="290" r="22"/><circle cx="112" cy="380" r="18"/></g>
    <g fill="none" stroke-width="3"><rect x="58" y="156" width="104" height="104" rx="6" stroke="#34d399"/><rect x="138" y="242" width="116" height="116" rx="6" stroke="#facc15"/><rect x="70" y="340" width="100" height="100" rx="6" stroke="#34d399"/></g>
    <g><rect x="58" y="134" width="76" height="22" rx="4" fill="#34d399"/><rect x="138" y="220" width="84" height="22" rx="4" fill="#facc15"/><rect x="70" y="318" width="76" height="22" rx="4" fill="#34d399"/></g>
    <g fill="#052e1c"><rect x="66" y="141" width="50" height="8" rx="4"/><rect x="146" y="227" width="60" height="8" rx="4"/><rect x="78" y="325" width="50" height="8" rx="4"/></g>
    <rect x="40" y="490" width="220" height="64" rx="18" fill="#050a07" fill-opacity=".7"/>
    <circle cx="150" cy="522" r="20" fill="#ffffff"/>
  </g>

  <!-- NFC card -->
  <g transform="translate(110 760) rotate(-10)">
    <rect width="260" height="160" rx="18" fill="#f3f5f2"/>
    <rect x="24" y="28" width="46" height="36" rx="6" fill="#facc15" fill-opacity=".8"/>
    <g fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round"><path d="M190 60 a24 24 0 0 1 0 40"/><path d="M204 46 a42 42 0 0 1 0 68"/><path d="M218 32 a60 60 0 0 1 0 96"/></g>
    <rect x="24" y="112" width="120" height="12" rx="6" fill="#0b0b0c"/>
  </g>
</svg>
