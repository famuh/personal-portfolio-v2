<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Placeholder presentation board for the P3 system: dashboard, purchase order form and stock card on a Figma-style canvas</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0b0b0c" fill-opacity=".08"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b0b0c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f2f4f7"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <text x="80" y="92" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#0b0b0c">P3: Penjualan, Pembelian &amp; Persediaan</text>
  <text x="80" y="128" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5d5d58">Purchasing → sales → stock, one system</text>

  <!-- frame 1: dashboard (large) -->
  <text x="80" y="198" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">01 Dashboard</text>
  <g filter="url(#sh)"><rect x="80" y="210" width="760" height="520" rx="14" fill="#ffffff"/></g>
  <rect x="80" y="210" width="170" height="520" rx="14" fill="#f8fafc"/>
  <rect x="236" y="210" width="14" height="520" fill="#f8fafc"/>
  <rect x="104" y="240" width="96" height="14" rx="7" fill="#0b0b0c"/>
  <rect x="96" y="286" width="138" height="28" rx="8" fill="#7c3aed" fill-opacity=".14"/>
  <g fill="#5d5d58" fill-opacity=".4"><rect x="108" y="296" width="80" height="9" rx="4"/><rect x="108" y="334" width="96" height="9" rx="4"/><rect x="108" y="364" width="70" height="9" rx="4"/><rect x="108" y="394" width="90" height="9" rx="4"/><rect x="108" y="424" width="76" height="9" rx="4"/></g>
  <g>
    <rect x="276" y="240" width="170" height="90" rx="12" fill="#f8fafc"/><rect x="460" y="240" width="170" height="90" rx="12" fill="#f8fafc"/><rect x="644" y="240" width="170" height="90" rx="12" fill="#f8fafc"/>
    <g fill="#5d5d58" fill-opacity=".45"><rect x="294" y="260" width="70" height="8" rx="4"/><rect x="478" y="260" width="80" height="8" rx="4"/><rect x="662" y="260" width="60" height="8" rx="4"/></g>
    <g fill="#0b0b0c"><rect x="294" y="284" width="100" height="22" rx="6"/><rect x="478" y="284" width="90" height="22" rx="6"/><rect x="662" y="284" width="110" height="22" rx="6"/></g>
  </g>
  <rect x="276" y="350" width="538" height="356" rx="12" fill="#f8fafc"/>
  <g fill="#5d5d58" fill-opacity=".5"><rect x="296" y="370" width="60" height="9" rx="4"/><rect x="420" y="370" width="80" height="9" rx="4"/><rect x="580" y="370" width="50" height="9" rx="4"/><rect x="700" y="370" width="70" height="9" rx="4"/></g>
  <g fill="#e2e8f0"><rect x="296" y="396" width="498" height="1"/><rect x="296" y="436" width="498" height="1"/><rect x="296" y="476" width="498" height="1"/><rect x="296" y="516" width="498" height="1"/><rect x="296" y="556" width="498" height="1"/><rect x="296" y="596" width="498" height="1"/><rect x="296" y="636" width="498" height="1"/></g>
  <g fill="#0b0b0c" fill-opacity=".7"><rect x="296" y="412" width="90" height="8" rx="4"/><rect x="296" y="452" width="110" height="8" rx="4"/><rect x="296" y="492" width="80" height="8" rx="4"/><rect x="296" y="532" width="100" height="8" rx="4"/><rect x="296" y="572" width="90" height="8" rx="4"/><rect x="296" y="612" width="70" height="8" rx="4"/></g>
  <g fill="#5d5d58" fill-opacity=".4"><rect x="420" y="412" width="120" height="8" rx="4"/><rect x="420" y="452" width="100" height="8" rx="4"/><rect x="420" y="492" width="130" height="8" rx="4"/><rect x="420" y="532" width="90" height="8" rx="4"/><rect x="420" y="572" width="110" height="8" rx="4"/><rect x="420" y="612" width="100" height="8" rx="4"/></g>
  <g fill="#0b0b0c" fill-opacity=".6"><rect x="740" y="412" width="40" height="8" rx="4"/><rect x="740" y="452" width="40" height="8" rx="4"/><rect x="740" y="492" width="40" height="8" rx="4"/><rect x="740" y="532" width="40" height="8" rx="4"/><rect x="740" y="572" width="40" height="8" rx="4"/><rect x="740" y="612" width="40" height="8" rx="4"/></g>

  <path d="M860 450 C 890 450 900 400 930 400" fill="none" stroke="#0b0b0c" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M924 392 L936 400 L924 408" fill="none" stroke="#0b0b0c" stroke-opacity=".35" stroke-width="2.5"/>

  <!-- frame 2: purchase order form -->
  <text x="950" y="198" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">02 Purchase order</text>
  <g filter="url(#sh)"><rect x="950" y="210" width="280" height="420" rx="14" fill="#ffffff"/></g>
  <rect x="974" y="238" width="140" height="13" rx="6" fill="#0b0b0c"/>
  <g fill="#5d5d58" fill-opacity=".45"><rect x="974" y="276" width="70" height="8" rx="4"/><rect x="974" y="340" width="60" height="8" rx="4"/><rect x="974" y="404" width="80" height="8" rx="4"/></g>
  <g fill="none" stroke="#cbd5e1" stroke-width="2"><rect x="974" y="292" width="232" height="34" rx="8"/><rect x="974" y="356" width="232" height="34" rx="8"/><rect x="974" y="420" width="110" height="34" rx="8"/><rect x="1096" y="420" width="110" height="34" rx="8"/></g>
  <rect x="974" y="476" width="232" height="70" rx="10" fill="#f8fafc"/>
  <g fill="#5d5d58" fill-opacity=".4"><rect x="990" y="494" width="140" height="8" rx="4"/><rect x="990" y="516" width="100" height="8" rx="4"/></g>
  <rect x="974" y="570" width="232" height="38" rx="19" fill="#7c3aed"/>
  <rect x="1050" y="584" width="80" height="10" rx="5" fill="#ffffff"/>

  <!-- frame 3: stock card -->
  <text x="1270" y="318" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">03 Stock card</text>
  <g filter="url(#sh)"><rect x="1270" y="330" width="250" height="400" rx="14" fill="#ffffff"/></g>
  <rect x="1292" y="356" width="120" height="13" rx="6" fill="#0b0b0c"/>
  <rect x="1292" y="388" width="206" height="80" rx="10" fill="#f8fafc"/>
  <g fill="#5d5d58" fill-opacity=".45"><rect x="1308" y="404" width="60" height="8" rx="4"/></g>
  <rect x="1308" y="424" width="80" height="24" rx="6" fill="#0b0b0c"/>
  <g>
    <rect x="1292" y="484" width="206" height="38" rx="8" fill="#f8fafc"/><rect x="1292" y="530" width="206" height="38" rx="8" fill="#f8fafc"/><rect x="1292" y="576" width="206" height="38" rx="8" fill="#f8fafc"/><rect x="1292" y="622" width="206" height="38" rx="8" fill="#f8fafc"/>
    <g fill="#16a34a"><rect x="1452" y="498" width="34" height="9" rx="4"/><rect x="1452" y="590" width="34" height="9" rx="4"/></g>
    <g fill="#dc2626"><rect x="1452" y="544" width="34" height="9" rx="4"/><rect x="1452" y="636" width="34" height="9" rx="4"/></g>
    <g fill="#5d5d58" fill-opacity=".5"><rect x="1306" y="498" width="90" height="9" rx="4"/><rect x="1306" y="544" width="80" height="9" rx="4"/><rect x="1306" y="590" width="100" height="9" rx="4"/><rect x="1306" y="636" width="70" height="9" rx="4"/></g>
  </g>

  <text x="80" y="900" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5d5d58">Figma · dashboard + 2 key screens</text>
</svg>
