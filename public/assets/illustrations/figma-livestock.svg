<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Placeholder presentation board for the livestock and distributor system: a desktop dashboard and two mobile screens on a Figma-style canvas</title>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0b0b0c" fill-opacity=".08"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b0b0c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#f3f5f1"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- board title (like a Figma section label) -->
  <text x="80" y="92" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#0b0b0c">Livestock &amp; distributor system</text>
  <text x="80" y="128" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5d5d58">User flow → data structure → hi-fi prototype</text>

  <!-- frame 1: desktop dashboard -->
  <text x="80" y="198" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">Dashboard (desktop)</text>
  <g filter="url(#sh)">
    <rect x="80" y="210" width="860" height="560" rx="14" fill="#ffffff"/>
  </g>
  <rect x="80" y="210" width="190" height="560" rx="14" fill="#123b2b"/>
  <rect x="256" y="210" width="14" height="560" fill="#123b2b"/>
  <g fill="#ffffff" fill-opacity=".85"><rect x="108" y="244" width="110" height="14" rx="7"/></g>
  <g fill="#ffffff" fill-opacity=".35"><rect x="108" y="300" width="130" height="10" rx="5"/><rect x="108" y="330" width="100" height="10" rx="5"/><rect x="108" y="360" width="120" height="10" rx="5"/><rect x="108" y="390" width="90" height="10" rx="5"/></g>
  <rect x="100" y="292" width="150" height="26" rx="8" fill="#34d399" fill-opacity=".25"/>
  <g>
    <rect x="300" y="240" width="190" height="96" rx="12" fill="#f3f5f1"/>
    <rect x="510" y="240" width="190" height="96" rx="12" fill="#f3f5f1"/>
    <rect x="720" y="240" width="190" height="96" rx="12" fill="#f3f5f1"/>
    <g fill="#5d5d58" fill-opacity=".45"><rect x="320" y="262" width="80" height="9" rx="4"/><rect x="530" y="262" width="90" height="9" rx="4"/><rect x="740" y="262" width="70" height="9" rx="4"/></g>
    <g fill="#0b0b0c"><rect x="320" y="290" width="110" height="22" rx="6"/><rect x="530" y="290" width="90" height="22" rx="6"/><rect x="740" y="290" width="120" height="22" rx="6"/></g>
  </g>
  <rect x="300" y="356" width="400" height="250" rx="12" fill="#f3f5f1"/>
  <polyline points="330,560 390,520 450,540 510,470 570,490 630,420 670,440" fill="none" stroke="#047857" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="330,580 390,560 450,566 510,530 570,545 630,500 670,512" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="720" y="356" width="190" height="250" rx="12" fill="#f3f5f1"/>
  <circle cx="815" cy="460" r="60" fill="none" stroke="#e8e8e4" stroke-width="22"/>
  <path d="M815 400 a60 60 0 0 1 52 90" fill="none" stroke="#047857" stroke-width="22"/>
  <rect x="300" y="626" width="610" height="120" rx="12" fill="#f3f5f1"/>
  <g fill="#5d5d58" fill-opacity=".35"><rect x="320" y="650" width="200" height="9" rx="4"/><rect x="320" y="678" width="540" height="8" rx="4"/><rect x="320" y="700" width="500" height="8" rx="4"/><rect x="320" y="722" width="460" height="8" rx="4"/></g>

  <!-- flow arrow -->
  <path d="M960 470 C 990 470 1000 440 1030 440" fill="none" stroke="#0b0b0c" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="6 6"/>
  <path d="M1024 432 L1036 440 L1024 448" fill="none" stroke="#0b0b0c" stroke-opacity=".35" stroke-width="2.5"/>

  <!-- frame 2: mobile livestock record -->
  <text x="1050" y="198" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">Livestock record</text>
  <g filter="url(#sh)"><rect x="1050" y="210" width="220" height="460" rx="28" fill="#ffffff"/></g>
  <rect x="1050" y="210" width="220" height="110" rx="28" fill="#123b2b"/>
  <rect x="1050" y="290" width="220" height="30" fill="#123b2b"/>
  <rect x="1074" y="246" width="100" height="12" rx="6" fill="#ffffff" fill-opacity=".85"/>
  <rect x="1074" y="268" width="140" height="9" rx="4" fill="#ffffff" fill-opacity=".4"/>
  <g>
    <rect x="1070" y="340" width="180" height="70" rx="12" fill="#f3f5f1"/>
    <rect x="1070" y="420" width="180" height="70" rx="12" fill="#f3f5f1"/>
    <rect x="1070" y="500" width="180" height="70" rx="12" fill="#f3f5f1"/>
    <g fill="#cfe9dc"><circle cx="1100" cy="375" r="16"/><circle cx="1100" cy="455" r="16"/><circle cx="1100" cy="535" r="16"/></g>
    <g fill="#0b0b0c"><rect x="1126" y="364" width="80" height="9" rx="4"/><rect x="1126" y="444" width="70" height="9" rx="4"/><rect x="1126" y="524" width="90" height="9" rx="4"/></g>
    <g fill="#5d5d58" fill-opacity=".4"><rect x="1126" y="382" width="100" height="7" rx="3"/><rect x="1126" y="462" width="90" height="7" rx="3"/><rect x="1126" y="542" width="110" height="7" rx="3"/></g>
  </g>
  <rect x="1070" y="600" width="180" height="44" rx="22" fill="#0b0b0c"/>
  <rect x="1120" y="617" width="80" height="10" rx="5" fill="#34d399"/>

  <!-- frame 3: mobile distributor order -->
  <text x="1310" y="318" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d5d58">Distributor order</text>
  <g filter="url(#sh)"><rect x="1310" y="330" width="220" height="460" rx="28" fill="#ffffff"/></g>
  <rect x="1330" y="360" width="120" height="12" rx="6" fill="#0b0b0c"/>
  <rect x="1330" y="382" width="150" height="8" rx="4" fill="#5d5d58" fill-opacity=".4"/>
  <rect x="1330" y="410" width="180" height="120" rx="14" fill="#f3f5f1"/>
  <g fill="#5d5d58" fill-opacity=".4"><rect x="1348" y="430" width="90" height="8" rx="4"/><rect x="1348" y="452" width="140" height="8" rx="4"/><rect x="1348" y="474" width="120" height="8" rx="4"/></g>
  <rect x="1348" y="498" width="70" height="18" rx="9" fill="#d1fae5"/>
  <g fill="#e8e8e4"><rect x="1330" y="546" width="180" height="40" rx="10"/><rect x="1330" y="596" width="180" height="40" rx="10"/><rect x="1330" y="646" width="180" height="40" rx="10"/></g>
  <rect x="1330" y="720" width="180" height="44" rx="22" fill="#047857"/>
  <rect x="1380" y="737" width="80" height="10" rx="5" fill="#ffffff"/>

  <!-- footer note -->
  <text x="80" y="900" font-family="Inter, Arial, sans-serif" font-size="16" fill="#5d5d58">Figma · 1 desktop flow + 2 mobile screens</text>
</svg>
