<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration: a self-ordering kiosk on a landscape TV screen and a tablet showing the same ordering flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1e"/>
      <stop offset="1" stop-color="#0b1712"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f1ede4"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1420" cy="120" r="300" fill="none" stroke="#3ddc97" stroke-opacity=".12" stroke-width="90"/>

  <!-- TV kiosk -->
  <rect x="150" y="150" width="1040" height="620" rx="28" fill="#050a07"/>
  <rect x="172" y="172" width="996" height="576" rx="14" fill="url(#screen)"/>
  <rect x="640" y="770" width="60" height="120" fill="#050a07"/>
  <rect x="520" y="880" width="300" height="24" rx="12" fill="#050a07"/>
  <!-- header -->
  <rect x="200" y="200" width="160" height="22" rx="11" fill="#17160f"/>
  <circle cx="380" cy="211" r="8" fill="#3ddc97"/>
  <g fill="#ebe6da">
    <rect x="200" y="250" width="110" height="36" rx="18" fill="#17160f"/>
    <rect x="320" y="250" width="110" height="36" rx="18"/>
    <rect x="440" y="250" width="110" height="36" rx="18"/>
    <rect x="560" y="250" width="110" height="36" rx="18"/>
  </g>
  <!-- menu grid -->
  <g>
    <rect x="200" y="310" width="200" height="200" rx="16" fill="#ebe6da"/>
    <rect x="420" y="310" width="200" height="200" rx="16" fill="#ebe6da"/>
    <rect x="640" y="310" width="200" height="200" rx="16" fill="#ebe6da"/>
    <rect x="200" y="530" width="200" height="190" rx="16" fill="#ebe6da"/>
    <rect x="420" y="530" width="200" height="190" rx="16" fill="#ebe6da"/>
    <rect x="640" y="530" width="200" height="190" rx="16" fill="#ebe6da"/>
    <g fill="#d6cfbf">
      <circle cx="300" cy="390" r="52"/><circle cx="520" cy="390" r="52"/><circle cx="740" cy="390" r="52"/>
      <circle cx="300" cy="605" r="48"/><circle cx="520" cy="605" r="48"/><circle cx="740" cy="605" r="48"/>
    </g>
    <g fill="#17160f">
      <rect x="225" y="462" width="110" height="12" rx="6"/><rect x="445" y="462" width="90" height="12" rx="6"/><rect x="665" y="462" width="120" height="12" rx="6"/>
      <rect x="225" y="672" width="100" height="12" rx="6"/><rect x="445" y="672" width="120" height="12" rx="6"/><rect x="665" y="672" width="80" height="12" rx="6"/>
    </g>
    <g fill="#0b6b43">
      <rect x="225" y="484" width="56" height="10" rx="5"/><rect x="445" y="484" width="56" height="10" rx="5"/><rect x="665" y="484" width="56" height="10" rx="5"/>
      <rect x="225" y="694" width="56" height="10" rx="5"/><rect x="445" y="694" width="56" height="10" rx="5"/><rect x="665" y="694" width="56" height="10" rx="5"/>
    </g>
  </g>
  <!-- order summary -->
  <rect x="870" y="200" width="270" height="520" rx="16" fill="#17160f"/>
  <rect x="898" y="230" width="120" height="16" rx="8" fill="#f4f1ea"/>
  <g fill="#f4f1ea" fill-opacity=".35">
    <rect x="898" y="290" width="200" height="10" rx="5"/><rect x="898" y="312" width="140" height="10" rx="5"/>
    <rect x="898" y="360" width="190" height="10" rx="5"/><rect x="898" y="382" width="120" height="10" rx="5"/>
    <rect x="898" y="430" width="210" height="10" rx="5"/><rect x="898" y="452" width="100" height="10" rx="5"/>
  </g>
  <rect x="898" y="560" width="214" height="1" fill="#f4f1ea" fill-opacity=".25"/>
  <rect x="898" y="585" width="90" height="14" rx="7" fill="#f4f1ea"/>
  <rect x="1040" y="585" width="72" height="14" rx="7" fill="#3ddc97"/>
  <rect x="898" y="640" width="214" height="56" rx="28" fill="#3ddc97"/>
  <rect x="955" y="662" width="100" height="12" rx="6" fill="#0b1f15"/>

  <!-- tablet -->
  <g transform="translate(1080 430) rotate(6)">
    <rect width="380" height="500" rx="34" fill="#050a07"/>
    <rect x="18" y="18" width="344" height="464" rx="20" fill="url(#screen)"/>
    <rect x="44" y="48" width="110" height="16" rx="8" fill="#17160f"/>
    <rect x="44" y="88" width="140" height="140" rx="14" fill="#ebe6da"/>
    <rect x="196" y="88" width="140" height="140" rx="14" fill="#ebe6da"/>
    <rect x="44" y="240" width="140" height="140" rx="14" fill="#ebe6da"/>
    <rect x="196" y="240" width="140" height="140" rx="14" fill="#ebe6da"/>
    <g fill="#d6cfbf"><circle cx="114" cy="150" r="38"/><circle cx="266" cy="150" r="38"/><circle cx="114" cy="302" r="38"/><circle cx="266" cy="302" r="38"/></g>
    <rect x="44" y="404" width="292" height="52" rx="26" fill="#17160f"/>
    <rect x="140" y="424" width="100" height="12" rx="6" fill="#3ddc97"/>
  </g>
</svg>
